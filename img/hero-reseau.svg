<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460"><title>Réseau de neurones animé</title><style>
.flow{stroke-dasharray:6 10;animation:flow 2.4s linear infinite}
.node{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
.d1{animation-delay:-.6s}.d2{animation-delay:-1.2s}.d3{animation-delay:-1.8s}
@keyframes flow{to{stroke-dashoffset:-32}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.25);opacity:.75}}
@media (prefers-reduced-motion:reduce){.flow,.node{animation:none}}
