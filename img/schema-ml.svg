<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300"><title>Données, entraînement, modèle puis prédiction</title><rect width="800" height="300" fill="#FFFFFF"/><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B1026"/></marker></defs><rect x="20" y="95" width="150" height="110" rx="16" fill="#00CEC9"/><text x="95" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Données</text><text x="95" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#FFFFFF">des exemples</text><line x1="176" y1="150" x2="215" y2="150" stroke="#0B1026" stroke-width="4" marker-end="url(#fl)"/><rect x="223" y="95" width="150" height="110" rx="16" fill="#6C5CE7"/><text x="298" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Entraînement</text><text x="298" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#FFFFFF">il s’ajuste</text><line x1="379" y1="150" x2="419" y2="150" stroke="#0B1026" stroke-width="4" marker-end="url(#fl)"/><rect x="427" y="95" width="150" height="110" rx="16" fill="#1B2140"/><text x="502" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Modèle</text><text x="502" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#FFFFFF">les règles apprises</text><line x1="583" y1="150" x2="622" y2="150" stroke="#0B1026" stroke-width="4" marker-end="url(#fl)"/><rect x="630" y="95" width="150" height="110" rx="16" fill="#E17055"/><text x="705" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Prédiction</text><text x="705" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#FFFFFF">un nouveau cas</text></svg>
